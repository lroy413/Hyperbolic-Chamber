# Cloudflare Worker — static site config for Oboros
#
# IMPORTANT: "name" must EXACTLY match your existing Worker's name
# (Cloudflare dashboard -> your Worker -> Settings -> General -> Name).
# If it doesn't match, wrangler deploys to a DIFFERENT worker and
# oboros.app will keep serving the old version.

name = "oboros"
compatibility_date = "2026-08-05"

# dist/ is generated by `npm run build` and is not committed. The CI workflow
# builds it before deploying; a local `wrangler deploy` needs a build first or
# it uploads nothing.
[assets]
directory = "./dist"

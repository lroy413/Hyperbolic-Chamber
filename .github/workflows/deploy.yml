# Build, verify, then ship. One job on purpose: the artifact that gets uploaded
# is the exact dist/ the suites and audits just ran against, with no rebuild in
# between that could differ. dist/ is not in the repo — it is made here.
#
# The deploy step needs two repository secrets:
#   CLOUDFLARE_API_TOKEN    — "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID
# and `name` in wrangler.toml must match the existing Worker exactly, or this
# creates a second Worker and oboros.app keeps serving the old build with no
# error anywhere.

name: build, test, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository — the build output is uploaded to
# Cloudflare, never committed back.
permissions:
  contents: read

# A second push should not race the first one to the same Worker.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # A full run is 31 suites and two audits — 15-25 minutes of real browser work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The suites launch Playwright's own Chromium unless CHROMIUM_PATH says
      # otherwise, so it has to actually be on disk here.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Lint courses
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit
        run: npm run audit

      # Pull requests get everything above and stop here.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
